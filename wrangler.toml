# Cloudflare Worker Configuration
# For more information, see https://developers.cloudflare.com/workers/wrangler/configuration/

name = "bing-wallpaper-uploader"
main = "src/index.ts"
compatibility_date = "2025-06-27"

# Cron Triggers
# Schedule: Run every day at 8:00 AM UTC (4:00 PM Beijing time)
# You can adjust the cron expression based on your needs
# Cron format: MIN HOUR DAY MONTH DAY-OF-WEEK
[triggers]
crons = ["0 8 * * *"]

# Environment Variables
# [vars]
# LOG_LEVEL = "info"
# BING_MARKET = "en-US"
# BING_RESOLUTION = "1920x1080"

# Secrets (DO NOT commit secrets to git)
# Use: wrangler secret put <VARIABLE_NAME>
# Required secrets:
# - IMG_BED_URL: Your Cloudflare ImgBed base URL
# - IMG_BED_AUTH_CODE: Your ImgBed upload authentication code
# - TRIGGER_TOKEN: Token to authenticate manual HTTP triggers (/upload, /upload/multi, /upload/date)
# Optional secrets:
# - IMG_BED_CHANNEL: Upload channel (telegram, cfr2, s3, discord, huggingface)

# Limits
[limits]
cpu_ms = 1500

# KV Bindings (optional)
# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "your-kv-namespace-id"

# D1 Database Bindings
# Used for idempotency: tracks uploaded wallpaper dates to prevent duplicate uploads.
# Setup:
#   1. wrangler d1 create bing-wallpaper-db
#   2. Copy the generated database_id below (replace "your-database-id")
#   3. The Worker calls db.initialize() on each cron run to auto-create the table.
#      To pre-create manually:
#      wrangler d1 execute bing-wallpaper-db --command \
#        "CREATE TABLE IF NOT EXISTS uploaded_wallpapers (date TEXT PRIMARY KEY, url TEXT NOT NULL, uploaded_at INTEGER NOT NULL);"
[[d1_databases]]
binding = "DB"
database_name = "bing-wallpaper-db"
database_id = "your-database-id"

# R2 Bindings (optional)
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "bing-wallpaper-images"
